name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: cargo test
        working-directory: master
        run: cargo test

      - name: Build release binaries smoke
        env:
          VITE_CUPIDMQ_METRICS: /metrics
        run: |
          cd master && cargo build --release --bin cupidmq-headless
          cd ../dashboard && npm ci && npm run build
          cd ../master && cargo build --release --bin cupidmq --features embed-dashboard

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: uv sync + unittest
        working-directory: python-client
        run: |
          uv sync
          uv run python -m unittest discover -s tests -p "test_*.py" -v
        env:
          UV_PYTHON: "3.11"
