[package]
name = "cupidmq"
version = "0.1.0"
edition = "2021"
description = "CupidMQ — brokerless P2P batch queue; master matchmaker + producer client"
repository = "https://github.com/WilianZilv/cupidmq"

[lib]
name = "cupidmq"

[[bin]]
name = "cupidmq"
path = "src/main.rs"

[[example]]
name = "producer"
path = "examples/producer.rs"

[[example]]
name = "consumer"
path = "examples/consumer.rs"

[[example]]
name = "cupidmq-producer"
path = "examples/cupidmq-producer.rs"

[[example]]
name = "docker-consumer"
path = "examples/docker-consumer.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json"] }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

rand = "0.8"
socket2 = "0.5"

[dev-dependencies]